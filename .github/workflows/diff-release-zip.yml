name: Diff-zip bij release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      huidige_tag:
        description: 'Tag waarvoor de update-zip gemaakt moet worden (bv. v1.20)'
        required: true
      vorige_tag:
        description: 'Vorige tag om mee te vergelijken (leeg = automatisch de tag ervoor)'
        required: false

permissions:
  contents: write

jobs:
  build-diff-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (met volledige geschiedenis en tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vorige tag bepalen
        id: vorige
        run: |
          if [ -n "${{ github.event.inputs.huidige_tag }}" ]; then
            HUIDIGE_TAG="${{ github.event.inputs.huidige_tag }}"
          else
            HUIDIGE_TAG="${GITHUB_REF_NAME}"
          fi
          if [ -n "${{ github.event.inputs.vorige_tag }}" ]; then
            VORIGE_TAG="${{ github.event.inputs.vorige_tag }}"
          else
            VORIGE_TAG=$(git tag --sort=-creatordate | grep -v "^${HUIDIGE_TAG}$" | head -n1)
          fi
          echo "huidige=$HUIDIGE_TAG" >> "$GITHUB_OUTPUT"
          echo "vorige=$VORIGE_TAG" >> "$GITHUB_OUTPUT"

          # Debug: alle bekende tags + welke twee er nu precies gekozen zijn -
          # zichtbaar in de run-log, zodat een leeg diff-resultaat voortaan
          # meteen te verklaren is zonder achteraf te moeten reconstrueren.
          echo "--- Alle tags (nieuwste eerst) ---"
          git tag --sort=-creatordate
          echo "--- Gekozen voor deze run ---"
          echo "huidige_tag: $HUIDIGE_TAG (commit: $(git rev-list -n 1 $HUIDIGE_TAG 2>/dev/null || echo 'ONBEKEND - tag bestaat niet!'))"
          echo "vorige_tag:  $VORIGE_TAG (commit: $(git rev-list -n 1 $VORIGE_TAG 2>/dev/null || echo 'ONBEKEND - tag bestaat niet!'))"

      - name: Diff-zip bouwen
        id: bouwen
        if: steps.vorige.outputs.vorige != ''
        run: |
          UITSLUITEN='^\.github/'

          mkdir -p /tmp/diffbestanden
          git diff --name-only --diff-filter=ACMR "${{ steps.vorige.outputs.vorige }}" "${{ steps.vorige.outputs.huidige }}" \
            | grep -Ev "$UITSLUITEN" > /tmp/gewijzigd.txt || true
          while IFS= read -r bestand; do
            mkdir -p "/tmp/diffbestanden/$(dirname "$bestand")"
            cp "$bestand" "/tmp/diffbestanden/$bestand"
          done < /tmp/gewijzigd.txt

          git diff --name-only --diff-filter=D "${{ steps.vorige.outputs.vorige }}" "${{ steps.vorige.outputs.huidige }}" \
            | grep -Ev "$UITSLUITEN" > /tmp/verwijderd.txt || true
          if [ -s /tmp/verwijderd.txt ]; then
            cp /tmp/verwijderd.txt "/tmp/diffbestanden/VERWIJDERDE_BESTANDEN.txt"
          fi

          echo "--- Gevonden gewijzigde bestanden ---"
          cat /tmp/gewijzigd.txt

          if [ "$(ls -A /tmp/diffbestanden)" ]; then
            cd /tmp/diffbestanden && zip -r "/tmp/update-${{ steps.vorige.outputs.huidige }}.zip" .
            echo "heeft_zip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Geen verschillen gevonden tussen ${{ steps.vorige.outputs.vorige }} en ${{ steps.vorige.outputs.huidige }} - geen update-zip aangemaakt. Controleer of dit klopt!"
            echo "heeft_zip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff-zip uploaden naar de release
        if: steps.bouwen.outputs.heeft_zip == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.vorige.outputs.huidige }}" "/tmp/update-${{ steps.vorige.outputs.huidige }}.zip" --clobber
