name: Diff-zip bij release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-diff-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (met volledige geschiedenis en tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vorige tag bepalen
        id: vorige
        run: |
          HUIDIGE_TAG="${GITHUB_REF_NAME}"
          VORIGE_TAG=$(git tag --sort=-creatordate | grep -v "^${HUIDIGE_TAG}$" | head -n1)
          echo "huidige=$HUIDIGE_TAG" >> "$GITHUB_OUTPUT"
          echo "vorige=$VORIGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Diff-zip bouwen
        id: bouwen
        if: steps.vorige.outputs.vorige != ''
        run: |
          UITSLUITEN='^\.github/'

          mkdir -p /tmp/diffbestanden
          git diff --name-only --diff-filter=ACMR "${{ steps.vorige.outputs.vorige }}" "${{ steps.vorige.outputs.huidige }}" \
            | grep -Ev "$UITSLUITEN" > /tmp/gewijzigd.txt || true
          while IFS= read -r bestand; do
            mkdir -p "/tmp/diffbestanden/$(dirname "$bestand")"
            cp "$bestand" "/tmp/diffbestanden/$bestand"
          done < /tmp/gewijzigd.txt

          git diff --name-only --diff-filter=D "${{ steps.vorige.outputs.vorige }}" "${{ steps.vorige.outputs.huidige }}" \
            | grep -Ev "$UITSLUITEN" > /tmp/verwijderd.txt || true
          if [ -s /tmp/verwijderd.txt ]; then
            cp /tmp/verwijderd.txt "/tmp/diffbestanden/VERWIJDERDE_BESTANDEN.txt"
          fi

          if [ "$(ls -A /tmp/diffbestanden)" ]; then
            cd /tmp/diffbestanden && zip -r "/tmp/update-${{ steps.vorige.outputs.huidige }}.zip" .
            echo "heeft_zip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Geen verschillen gevonden, geen update-zip nodig."
            echo "heeft_zip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff-zip uploaden naar de release
        if: steps.bouwen.outputs.heeft_zip == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.vorige.outputs.huidige }}" "/tmp/update-${{ steps.vorige.outputs.huidige }}.zip" --clobber